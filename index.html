<script>
const SUPABASE_URL = 'https://wknwukrgitultvuyyjvg.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indrbnd1a3JnaXR1bHR2dXl5anZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0OTE0NDgsImV4cCI6MjA5NDA2NzQ0OH0.hecb0vXFIn1YnErgxSIwxqvrJ1eRMr2fWDWOXEVqw2A';
const GOOGLE_CLIENT_ID = '176085135923-ch4f9njgg2ocr3s3u5n7s1m5jst4vpe2.apps.googleusercontent.com';

// ─── Supabase client ─────────────────────────────────────────────────────────
const sb = {
  _jwt: null,
  _profile: null,

  headers() {
    const h = { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON };
    if (this._jwt) h['Authorization'] = `Bearer ${this._jwt}`;
    return h;
  },

  async rpc(path, method='GET', body=null) {
    const r = await fetch(SUPABASE_URL + path, {
      method, headers: this.headers(),
      body: body ? JSON.stringify(body) : null
    });
    if (!r.ok) { const e = await r.text(); throw new Error(e); }
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  },

  async from(table) {
    return {
      _table: table,
      _filters: [],
      _order: null,
      eq(col, val) { this._filters.push(`${col}=eq.${val}`); return this; },
      order(col, {ascending=true}={}) { this._order = `${col}.${ascending?'asc':'desc'}`; return this; },
      async select() {
        let url = `${SUPABASE_URL}/rest/v1/${this._table}?select=*`;
        if (this._filters.length) url += '&' + this._filters.join('&');
        if (this._order) url += `&order=${this._order}`;
        const r = await fetch(url, { headers: sb.headers() });
        if (!r.ok) throw new Error(await r.text());
        return r.json();
      },
      async insert(data) {
        const r = await fetch(`${SUPABASE_URL}/rest/v1/${this._table}`, {
          method:'POST', headers: {...sb.headers(), 'Prefer':'return=representation'},
          body: JSON.stringify(Array.isArray(data)?data:[data])
        });
        if (!r.ok) throw new Error(await r.text());
        return r.json();
      },
      async update(data) {
        let url = `${SUPABASE_URL}/rest/v1/${this._table}?`;
        if (this._filters.length) url += this._filters.join('&');
        const r = await fetch(url, {
          method:'PATCH', headers: {...sb.headers(), 'Prefer':'return=representation'},
          body: JSON.stringify(data)
        });
        if (!r.ok) throw new Error(await r.text());
        return r.json();
      },
      async delete() {
        let url = `${SUPABASE_URL}/rest/v1/${this._table}?`;
        if (this._filters.length) url += this._filters.join('&');
        const r = await fetch(url, { method:'DELETE', headers: sb.headers() });
        if (!r.ok) throw new Error(await r.text());
        return true;
      },
      async upsert(data) {
        const r = await fetch(`${SUPABASE_URL}/rest/v1/${this._table}`, {
          method:'POST', headers: {...sb.headers(), 'Prefer':'resolution=merge-duplicates,return=representation'},
          body: JSON.stringify(Array.isArray(data)?data:[data])
        });
        if (!r.ok) throw new Error(await r.text());
        return r.json();
      }
    };
  },

  async signInWithGoogle(id_token) {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=id_token`, {
      method:'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON },
      body: JSON.stringify({ provider:'google', id_token })
    });
    if (!r.ok) throw new Error(await r.text());
    const data = await r.json();
    this._jwt = data.access_token;
    return data;
  },

  async getOrCreateProfile(email, name) {
    const t = await this.from('profiles');
    let rows = await t.eq('email', email).select();
    if (!rows || rows.length === 0) {
      const t2 = await this.from('profiles');
      rows = await t2.insert({ email, name });
    }
    this._profile = rows[0];
    return this._profile;
  },

  get profile() { return this._profile; }
};

// ─── Auth flow ────────────────────────────────────────────────────────────────
let _resolveAuth;
window._authReady = new Promise(r => { _resolveAuth = r; });

window.addEventListener('load', () => {
  setTimeout(() => {
    if (!window.google) return;
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: async ({ credential }) => {
        try {
          document.getElementById('auth-err').textContent = 'A autenticar...';
          const _b64=credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'); const payload=JSON.parse(atob(_b64+'=='.slice(0,(4-_b64.length%4)%4)));
          await sb.signInWithGoogle(credential);
          await sb.getOrCreateProfile(payload.email, payload.name);
          document.getElementById('auth-screen').style.display = 'none';
          document.getElementById('root').style.display = 'block';
          _resolveAuth(sb.profile);
        } catch(e) {
          document.getElementById('auth-err').textContent = 'Erro: ' + e.message;
        }
      },
      auto_select: true,
    });
    google.accounts.id.prompt();
    document.getElementById('login-btn').onclick = () => {
      google.accounts.id.prompt();
    };
  }, 500);
});

// ─── Sync indicator ───────────────────────────────────────────────────────────
let _syncTimer;
window.showSync = () => {
  const el = document.getElementById('sync');
  el.classList.add('show');
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(() => el.classList.remove('show'), 2000);
};
</script>

<script type="text/babel" data-type="module">
const { useState, useEffect, useRef, useMemo, useCallback } = React;
const Recharts = await import("https://esm.sh/recharts@2.8.0");
const { PieChart, Pie, Cell, BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer } = Recharts;

// ─── Constants ────────────────────────────────────────────────────────────────
const ACCENT="#c8b89a", BG="#0d0d0f", SURFACE="#131317", SURFACE2="#16161a", BORDER="#1e1e24", MUTED="#555";
const CHART_COLORS=["#c8b89a","#7eb8c9","#9bb87e","#c97e7e","#b89ec8","#c9b07e","#7ec9b8","#c97eac","#a8c97e","#c9a87e"];
const PERIODS=["Mensal","Trimestral","Semestral","Anual","Único"];
const PERIOD_MONTHS={Mensal:1,Trimestral:3,Semestral:6,Anual:12,"Único":0};

function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36);}
function fmt(val){return(parseFloat(val)||0).toLocaleString("pt-PT",{style:"currency",currency:"EUR"});}
function daysUntil(d){if(!d)return null;return Math.ceil((new Date(d)-new Date())/86400000);}
function monthlyFromInvoices(invoices=[]){if(!invoices.length)return 0;return invoices.reduce((s,i)=>s+(parseFloat(i.amount)||0),0)/invoices.length;}
function annualFromInvoices(invoices=[]){return invoices.reduce((s,i)=>s+(parseFloat(i.amount)||0),0);}
function subMonthly(sub){const v=parseFloat(sub.value)||0;return sub.period==="Anual"?v/12:v;}
function subRenewalDate(sub){
  const today=new Date(),year=today.getFullYear();
  if(sub.period==="Anual"){
    if(!sub.renewalDay||!sub.renewalMonth)return "";
    let d=new Date(year,parseInt(sub.renewalMonth)-1,parseInt(sub.renewalDay));
    if(d<today)d=new Date(year+1,parseInt(sub.renewalMonth)-1,parseInt(sub.renewalDay));
    return d.toISOString().slice(0,10);
  } else {
    if(!sub.renewalDay)return "";
    let d=new Date(year,today.getMonth(),parseInt(sub.renewalDay));
    if(d<today)d=new Date(year,today.getMonth()+1,parseInt(sub.renewalDay));
    return d.toISOString().slice(0,10);
  }
}

// ─── Auto invoices ────────────────────────────────────────────────────────────
function generateFixedInvoices(sub, existingInvoices=[]) {
  if(!sub.fixed_value||!sub.fixed_amount||!sub.created_at_app)return[];
  const step=PERIOD_MONTHS[sub.fixed_period||"Mensal"]||1;
  if(step===0)return[];
  const day=Math.min(parseInt(sub.fixed_day)||1,28);
  const today=new Date(); today.setHours(23,59,59,0);
  const createdAt=new Date(sub.created_at_app);
  let cursor;
  const autoInvs=existingInvoices.filter(i=>i.auto);
  if(autoInvs.length>0){
    const dates=autoInvs.map(i=>i.date_from).filter(Boolean).sort();
    const last=new Date(dates[dates.length-1]);
    cursor=new Date(last.getFullYear(),last.getMonth()+step,day);
  } else {
    if((sub.fixed_period||"Mensal")==="Anual"&&sub.fixed_month){
      const month=parseInt(sub.fixed_month)-1;
      cursor=new Date(createdAt.getFullYear(),month,day);
      if(cursor<createdAt)cursor=new Date(createdAt.getFullYear()+1,month,day);
    } else {
      cursor=new Date(createdAt.getFullYear(),createdAt.getMonth(),day);
      if(cursor<createdAt)cursor=new Date(createdAt.getFullYear(),createdAt.getMonth()+step,day);
    }
  }
  const newInvs=[];
  let safety=0;
  while(cursor<=today&&safety<120){
    safety++;
    const date_from=cursor.toISOString().slice(0,10);
    const next=new Date(cursor.getFullYear(),cursor.getMonth()+step,day);
    const end=new Date(next.getFullYear(),next.getMonth(),next.getDate()-1);
    newInvs.push({id:uid(),subcategory_id:sub.id,owner_id:sub.owner_id,date_from,date_to:end.toISOString().slice(0,10),amount:sub.fixed_amount,notes:"",file_name:"",file_data:"",auto:true});
    cursor=next;
  }
  return newInvs;
}

// ─── DB helpers ───────────────────────────────────────────────────────────────
async function dbSelect(table, filters={}) {
  const t = await sb.from(table);
  let q = t;
  for(const [k,v] of Object.entries(filters)) q = q.eq(k,v);
  return q.select();
}
async function dbUpsert(table, data) {
  window.showSync();
  const t = await sb.from(table);
  return t.upsert(data);
}
async function dbDelete(table, id) {
  window.showSync();
  const t = await sb.from(table);
  return t.eq('id',id).delete();
}

// ─── UI Primitives ────────────────────────────────────────────────────────────
function RenewalBadge({date}){
  const days=daysUntil(date);
  if(days===null)return null;
  const[bg,col]=days<0?["#3a1a1a","#ff6b6b"]:days<=30?["#3a2a0a","#ffb347"]:["#1a2a1a","#6bcb77"];
  return <span style={{fontSize:"0.65rem",padding:"2px 8px",borderRadius:20,background:bg,color:col,border:`1px solid ${col}33`}}>{days<0?`Venceu há ${Math.abs(days)}d`:days===0?"Hoje":`${days}d`}</span>;
}

function SharedBadge({shared}){
  return <span style={{fontSize:"0.62rem",padding:"2px 7px",borderRadius:20,background:shared?"#1a2a1a":"#1e1e24",color:shared?"#6bcb77":"#555",border:`1px solid ${shared?"#6bcb7733":"#2a2a2e"}`}}>{shared?"partilhada":"privada"}</span>;
}

function Overlay({onClose,children,wide}){
  return(
    <div className="mob-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}
      style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.82)",backdropFilter:"blur(6px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:16}}>
      <div className="mob-full" style={{background:SURFACE,border:`1px solid ${BORDER}`,borderRadius:14,padding:30,width:"100%",maxWidth:wide?700:520,maxHeight:"92vh",overflowY:"auto"}}>
        {children}
      </div>
    </div>
  );
}

function MTitle({children}){return <div style={{fontFamily:"Fraunces,serif",fontSize:"1.2rem",fontWeight:300,color:"#e8e4dc",marginBottom:20}}>{children}</div>;}
function F({label,children,half}){return <div style={{marginBottom:13,gridColumn:half?undefined:"1/-1"}}><div style={{fontSize:"0.65rem",color:"#666",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:4}}>{label}</div>{children}</div>;}
function Btn({onClick,v="ghost",children,s={}}){
  const base={fontFamily:"'DM Mono',monospace",borderRadius:7,padding:"7px 16px",fontSize:"0.78rem",cursor:"pointer"};
  const variants={primary:{background:ACCENT,border:"none",color:BG,fontWeight:500},ghost:{background:"transparent",border:`1px solid ${BORDER}`,color:"#888"},danger:{background:"transparent",border:"1px solid #3a1a1a",color:"#ff6b6b"},subtle:{background:SURFACE2,border:`1px solid ${BORDER}`,color:"#777"}};
  return <button onClick={onClick} style={{...base,...variants[v],...s}}>{children}</button>;
}
function InfoChip({label,value}){return <div style={{background:"#0d0d0f",borderRadius:7,padding:"8px 12px"}}><div style={{fontSize:"0.6rem",color:MUTED,letterSpacing:"0.07em",textTransform:"uppercase",marginBottom:3}}>{label}</div><div style={{fontSize:"0.8rem",color:ACCENT}}>{value||"—"}</div></div>;}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [profile, setProfile] = useState(null);
  const [loading, setLoading] = useState(true);

  // Data
  const [categories, setCategories] = useState([]);
  const [subcategories, setSubcategories] = useState([]);
  const [invoices, setInvoices] = useState([]);
  const [contractDocs, setContractDocs] = useState([]);
  const [companies, setCompanies] = useState([]);
  const [subscriptions, setSubscriptions] = useState([]);

  // UI
  const [page, setPage] = useState("contracts");
  const [activeCatId, setActiveCatId] = useState(null);
  const [activeSubId, setActiveSubId] = useState(null);

  // Modals
  const [subModal, setSubModal] = useState(null);
  const [catModal, setCatModal] = useState(null);
  const [coModal, setCoModal] = useState(null);
  const [invModal, setInvModal] = useState(null);
  const [docModal, setDocModal] = useState(null);
  const [subscModal, setSubscModal] = useState(null);
  const [confirmDialog, setConfirmDialog] = useState(null);

  const pdfRef = useRef();
  const docFileRef = useRef();
  const subscFileRef = useRef();

  // ── Load data ──────────────────────────────────────────────────────────────
  useEffect(() => {
    window._authReady.then(async (prof) => {
      setProfile(prof);
      await loadAll(prof.id);
      setLoading(false);
    });
  }, []);

  async function loadAll(ownerId) {
    try {
      const [cats, subs, invs, docs, cos, subscrs] = await Promise.all([
        dbSelect('categories'),
        dbSelect('subcategories'),
        dbSelect('invoices'),
        dbSelect('contract_docs'),
        dbSelect('companies'),
        dbSelect('subscriptions'),
      ]);
      setCategories(cats||[]);
      setSubcategories(subs||[]);
      setInvoices(invs||[]);
      setContractDocs(docs||[]);
      setCompanies(cos||[]);
      setSubscriptions(subscrs||[]);
      if(cats&&cats.length>0) setActiveCatId(cats[0].id);

      // Apply auto invoices
      const newInvs=[];
      for(const sub of (subs||[])){
        if(!sub.fixed_value)continue;
        const subInvs=(invs||[]).filter(i=>i.subcategory_id===sub.id);
        const generated=generateFixedInvoices(sub,subInvs);
        if(generated.length>0) newInvs.push(...generated);
      }
      if(newInvs.length>0){
        await dbUpsert('invoices',newInvs);
        setInvoices(prev=>[...prev,...newInvs]);
      }
    } catch(e){ console.error('loadAll',e); }
  }

  // ── Helpers ────────────────────────────────────────────────────────────────
  function ask(msg, onConfirm){ setConfirmDialog({msg,onConfirm}); }
  const subsForCat = catId => subcategories.filter(s=>s.category_id===catId);
  const invForSub = subId => invoices.filter(i=>i.subcategory_id===subId);
  const docsForSub = subId => contractDocs.filter(d=>d.subcategory_id===subId);
  const catMonthly = catId => subsForCat(catId).reduce((s,sub)=>s+monthlyFromInvoices(invForSub(sub.id)),0);
  const activeCat = categories.find(c=>c.id===activeCatId);
  const activeSub = subcategories.find(s=>s.id===activeSubId);
  const grandMonthly = useMemo(()=>{
    const c=subcategories.reduce((s,sub)=>s+monthlyFromInvoices(invForSub(sub.id)),0);
    const sc=subscriptions.reduce((s,sub)=>s+subMonthly(sub),0);
    return c+sc;
  },[subcategories,invoices,subscriptions]);

  // ── Category CRUD ──────────────────────────────────────────────────────────
  const [catF, setCatF] = useState({name:"",icon:"",shared:false});
  async function saveCat(){
    if(!catF.name.trim())return;
    const row={id:catModal.id||uid(),owner_id:profile.id,name:catF.name,icon:catF.icon||"◆",shared:catF.shared};
    await dbUpsert('categories',[row]);
    setCategories(prev=>catModal.id?prev.map(c=>c.id===catModal.id?{...c,...row}:c):[...prev,row]);
    if(!catModal.id)setActiveCatId(row.id);
    setCatModal(null);
  }
  async function deleteCat(id){
    await dbDelete('categories',id);
    setCategories(prev=>prev.filter(c=>c.id!==id));
    setCatModal(null);
  }

  // ── Subcategory CRUD ───────────────────────────────────────────────────────
  const emptySF={name:"",company_id:"",contract_ref:"",join_date:"",renewal_date:"",period:"Mensal",notes:"",shared:false,fixed_value:false,fixed_amount:"",fixed_day:1,fixed_period:"Mensal",fixed_month:""};
  const [sf, setSf] = useState(emptySF);
  function openNewSub(catId){setSf({...emptySF,category_id:catId,shared:categories.find(c=>c.id===catId)?.shared||false});setSubModal({mode:"new"});}
  function openEditSub(sub){setSf({name:sub.name,company_id:sub.company_id||"",contract_ref:sub.contract_ref||"",join_date:sub.join_date||"",renewal_date:sub.renewal_date||"",renewal_date:sub.renewal_date||"",period:sub.period||"Mensal",notes:sub.notes||"",shared:sub.shared||false,fixed_value:sub.fixed_value||false,fixed_amount:sub.fixed_amount||"",fixed_day:sub.fixed_day||1,fixed_period:sub.fixed_period||"Mensal",fixed_month:sub.fixed_month||"",category_id:sub.category_id});setSubModal({mode:"edit",id:sub.id});}
  function openViewSub(sub){setActiveCatId(sub.category_id);setActiveSubId(sub.id);setSubModal({mode:"view",id:sub.id});}
  async function saveSub(){
    if(!sf.name.trim())return;
    const isNew=subModal.mode==="new";
    const id=isNew?uid():subModal.id;
    const row={id,owner_id:profile.id,...sf,created_at_app:isNew?new Date().toISOString():(subcategories.find(s=>s.id===id)?.created_at_app||new Date().toISOString())};
    await dbUpsert('subcategories',[row]);
    if(isNew){
      setSubcategories(prev=>[...prev,row]);
      // generate auto invoices
      const generated=generateFixedInvoices(row,[]);
      if(generated.length>0){
        await dbUpsert('invoices',generated);
        setInvoices(prev=>[...prev,...generated]);
      }
    } else {
      setSubcategories(prev=>prev.map(s=>s.id===id?{...s,...row}:s));
      if(!sf.fixed_value){
        // remove auto invoices
        const autoIds=invForSub(id).filter(i=>i.auto).map(i=>i.id);
        for(const aid of autoIds){ await dbDelete('invoices',aid); }
        setInvoices(prev=>prev.filter(i=>!(i.subcategory_id===id&&i.auto)));
      } else {
        const generated=generateFixedInvoices(row,invForSub(id));
        if(generated.length>0){
          await dbUpsert('invoices',generated);
          setInvoices(prev=>[...prev,...generated]);
        }
      }
    }
    setSubModal(null);
  }
  async function deleteSub(id){
    await dbDelete('subcategories',id);
    setSubcategories(prev=>prev.filter(s=>s.id!==id));
    setInvoices(prev=>prev.filter(i=>i.subcategory_id!==id));
    setContractDocs(prev=>prev.filter(d=>d.subcategory_id!==id));
    if(activeSubId===id)setActiveSubId(null);
    setSubModal(null);
  }

  // ── Invoice CRUD ───────────────────────────────────────────────────────────
  const emptyInv={date_from:"",date_to:"",amount:"",notes:"",file_name:"",file_data:""};
  const [invF, setInvF] = useState(emptyInv);
  function openAddInv(subId){setInvF({...emptyInv,subcategory_id:subId});setInvModal({mode:"new",subId});}
  function openEditInv(inv){setInvF({date_from:inv.date_from||"",date_to:inv.date_to||"",amount:inv.amount||"",notes:inv.notes||"",file_name:inv.file_name||"",file_data:inv.file_data||""});setInvModal({mode:"edit",id:inv.id,subId:inv.subcategory_id});}
  async function saveInv(){
    if(!invF.amount&&!invF.file_data)return;
    const id=invModal.mode==="new"?uid():invModal.id;
    const row={id,subcategory_id:invModal.subId,owner_id:profile.id,...invF,auto:false};
    await dbUpsert('invoices',[row]);
    setInvoices(prev=>invModal.mode==="new"?[row,...prev]:prev.map(i=>i.id===id?{...i,...row}:i));
    setInvModal(null);
  }
  async function deleteInv(id){
    await dbDelete('invoices',id);
    setInvoices(prev=>prev.filter(i=>i.id!==id));
    setInvModal(null);
  }

  // ── Contract doc CRUD ──────────────────────────────────────────────────────
  const emptyDoc={name:"",notes:"",file_name:"",file_data:""};
  const [docF, setDocF] = useState(emptyDoc);
  function openAddDoc(subId){setDocF({...emptyDoc});setDocModal({mode:"new",subId});}
  function openEditDoc(doc){setDocF({name:doc.name||"",notes:doc.notes||"",file_name:doc.file_name||"",file_data:doc.file_data||""});setDocModal({mode:"edit",id:doc.id,subId:doc.subcategory_id});}
  async function saveDoc(){
    if(!docF.name.trim()&&!docF.file_data)return;
    const id=docModal.mode==="new"?uid():docModal.id;
    const row={id,subcategory_id:docModal.subId,owner_id:profile.id,...docF};
    await dbUpsert('contract_docs',[row]);
    setContractDocs(prev=>docModal.mode==="new"?[row,...prev]:prev.map(d=>d.id===id?{...d,...row}:d));
    setDocModal(null);
  }
  async function deleteDoc(id){
    await dbDelete('contract_docs',id);
    setContractDocs(prev=>prev.filter(d=>d.id!==id));
    setDocModal(null);
  }

  // ── Company CRUD ───────────────────────────────────────────────────────────
  const emptyCo={name:"",nif:"",contact:"",website:"",notes:"",shared:true};
  const [coF, setCoF] = useState(emptyCo);
  async function saveCo(){
    if(!coF.name.trim())return;
    const id=coModal.id||uid();
    const row={id,owner_id:profile.id,...coF};
    await dbUpsert('companies',[row]);
    setCompanies(prev=>coModal.id?prev.map(c=>c.id===id?{...c,...row}:c):[...prev,row]);
    setCoModal(null);
  }
  async function deleteCo(id){
    await dbDelete('companies',id);
    setCompanies(prev=>prev.filter(c=>c.id!==id));
    setCoModal(null);
  }

  // ── Subscription CRUD ──────────────────────────────────────────────────────
  const emptySubsc={name:"",value:"",period:"Mensal",renewal_day:"",renewal_month:"",file_name:"",file_data:"",shared:false};
  const [subscF, setSubscF] = useState(emptySubsc);
  async function saveSubsc(){
    if(!subscF.name.trim())return;
    const id=subscModal.id||uid();
    const row={id,owner_id:profile.id,...subscF};
    await dbUpsert('subscriptions',[row]);
    setSubscriptions(prev=>subscModal.id?prev.map(s=>s.id===id?{...s,...row}:s):[...prev,row]);
    setSubscModal(null);
  }
  async function deleteSubsc(id){
    await dbDelete('subscriptions',id);
    setSubscriptions(prev=>prev.filter(s=>s.id!==id));
    setSubscModal(null);
  }

  // ── Dashboard data ─────────────────────────────────────────────────────────
  const dashCat = useMemo(()=>categories.map((cat,i)=>({
    name:cat.name,fill:CHART_COLORS[i%CHART_COLORS.length],
    mensal:parseFloat(catMonthly(cat.id).toFixed(2)),
    anual:parseFloat((catMonthly(cat.id)*12).toFixed(2))
  })).filter(d=>d.mensal>0),[categories,subcategories,invoices]);

  const dashSub = useMemo(()=>{
    const rows=[];
    categories.forEach((cat,ci)=>subsForCat(cat.id).forEach((sub,si)=>{
      const m=monthlyFromInvoices(invForSub(sub.id));
      if(m>0)rows.push({name:sub.name,cat:cat.name,mensal:parseFloat(m.toFixed(2)),fill:CHART_COLORS[(ci*4+si)%CHART_COLORS.length]});
    }));
    return rows;
  },[categories,subcategories,invoices]);

  // ── Dashboard drilldown ───────────────────────────────────────────────────
  const [drilldown, setDrilldown] = useState(null);
  const drillRows = useMemo(()=>{
    if(!drilldown)return[];
    if(drilldown==="mensal"||drilldown==="anual"){
      const rows=[];
      categories.forEach(cat=>subsForCat(cat.id).forEach(sub=>{
        const m=monthlyFromInvoices(invForSub(sub.id));
        if(m>0)rows.push({label:sub.name,sublabel:cat.name,value:drilldown==="anual"?m*12:m,sub,type:"sub"});
      }));
      subscriptions.forEach(sub=>{const m=subMonthly(sub);if(m>0)rows.push({label:sub.name,sublabel:"Subscrição",value:drilldown==="anual"?m*12:m,sub,type:"subscricao"});});
      return rows.sort((a,b)=>b.value-a.value);
    }
    if(drilldown==="categorias")return categories.map(cat=>({label:cat.name,sublabel:`${subsForCat(cat.id).length} subcategorias`,value:catMonthly(cat.id),cat,type:"categoria"})).filter(r=>r.value>0).sort((a,b)=>b.value-a.value);
    if(drilldown==="subscricoes")return subscriptions.map(sub=>({label:sub.name,sublabel:sub.period,value:subMonthly(sub),sub,type:"subscricao"})).sort((a,b)=>b.value-a.value);
    return[];
  },[drilldown,categories,subcategories,invoices,subscriptions]);

  const viewSub = subModal?.id ? subcategories.find(s=>s.id===subModal.id) : null;
  const viewCo = viewSub ? companies.find(c=>c.id===viewSub.company_id) : null;

  if(loading) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:MUTED,fontSize:"0.85rem"}}>A carregar...</div>;

  return (
    <div style={{minHeight:"100vh",background:BG,color:"#e8e4dc",fontFamily:"'DM Mono','Courier New',monospace"}}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Fraunces:ital,wght@0,300;0,700;1,300&display=swap');`}</style>

      {/* Desktop nav */}
      <nav className="desk-nav" style={{borderBottom:`1px solid ${BORDER}`,padding:"0 32px",display:"flex",alignItems:"center"}}>
        <div style={{fontFamily:"Fraunces,serif",fontSize:"1.25rem",fontWeight:300,paddingRight:28,paddingTop:15,paddingBottom:15,borderRight:`1px solid ${BORDER}`,marginRight:4}}>Contratos</div>
        {[["contracts","Visão Geral"],["subscriptions","Subscrições"],["dashboard","Dashboard"],["companies","Empresas"],["settings","Categorias"]].map(([id,label])=>(
          <button key={id} onClick={()=>setPage(id)} style={{background:"transparent",border:"none",color:page===id?ACCENT:"#555",padding:"15px 18px",fontSize:"0.76rem",letterSpacing:"0.05em",borderBottom:page===id?`2px solid ${ACCENT}`:"2px solid transparent"}}>{label}</button>
        ))}
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:"0.7rem",color:ACCENT}}>{fmt(grandMonthly)}<span style={{color:"#333"}}>/mês</span></span>
          <span style={{fontSize:"0.68rem",color:"#555"}}>{profile?.email}</span>
          <button onClick={()=>{
            google.accounts.id.disableAutoSelect();
            document.getElementById('root').style.display='none';
            document.getElementById('auth-screen').style.display='flex';
            document.getElementById('auth-err').textContent='';
          }} title="Sair" style={{background:"transparent",border:`1px solid ${BORDER}`,borderRadius:6,padding:"4px 8px",color:"#555",fontSize:"0.75rem",display:"flex",alignItems:"center",gap:4}}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </nav>

      {/* Mobile top bar */}
      <div className="mob-top" style={{display:"none",borderBottom:`1px solid ${BORDER}`,padding:"12px 16px",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,background:BG,zIndex:100}}>
        <div style={{fontFamily:"Fraunces,serif",fontSize:"1.1rem",fontWeight:300}}>Contratos</div>
        <div style={{fontSize:"0.72rem",color:ACCENT}}>{fmt(grandMonthly)}<span style={{color:"#444"}}>/mês</span></div>
      </div>

      {/* Mobile tab bar */}
      <div className="tab-bar">
        {[
          ["contracts","Início",<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>],
          ["subscriptions","Subscrições",<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M14.8 9A2 2 0 0 0 13 8h-2a2 2 0 0 0 0 4h2a2 2 0 0 1 0 4h-2a2 2 0 0 1-1.8-1M12 7v1m0 8v1"/></svg>],
          ["dashboard","Dashboard",<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>],
          ["companies","Empresas",<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>],
          ["settings","Categorias",<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>],
        ].map(([id,label,icon])=>(
          <button key={id} className={page===id?"active":""} onClick={()=>setPage(id)}>{icon}{label}</button>
        ))}
      </div>

      {/* ── Contracts ── */}
      {page==="contracts" && (
        <div style={{display:"flex",minHeight:"calc(100vh - 52px)"}}>
          <aside className="desk-aside" style={{width:230,borderRight:`1px solid ${BORDER}`,padding:"16px 0",flexShrink:0}}>
            {categories.map(cat=>(
              <div key={cat.id}>
                <div onClick={()=>{setActiveCatId(cat.id);setActiveSubId(null);}} className="rh"
                  style={{padding:"8px 18px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",background:activeCatId===cat.id&&!activeSubId?"#1a1a1e":"transparent",color:activeCatId===cat.id&&!activeSubId?"#e8e4dc":"#777",fontSize:"0.8rem"}}>
                  <span>{cat.icon} {cat.name}</span>
                  <span style={{fontSize:"0.65rem",color:catMonthly(cat.id)>0?ACCENT:"#333"}}>{fmt(catMonthly(cat.id))}</span>
                </div>
                {subsForCat(cat.id).map(sub=>(
                  <div key={sub.id} onClick={()=>openViewSub(sub)} className="rh"
                    style={{padding:"6px 18px 6px 34px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",background:activeSubId===sub.id?"#1a1a1e":"transparent",color:activeSubId===sub.id?"#d0ccc4":"#555",fontSize:"0.74rem"}}>
                    <span>{sub.name}</span>
                    {monthlyFromInvoices(invForSub(sub.id))>0&&<span style={{fontSize:"0.62rem",color:"#666"}}>{fmt(monthlyFromInvoices(invForSub(sub.id)))}</span>}
                  </div>
                ))}
              </div>
            ))}
          </aside>

          <main className="main-area" style={{flex:1,padding:"28px 36px",overflowY:"auto"}}>
            {/* Mobile category chips */}
            <div style={{display:"none"}} /><style>{`@media(max-width:768px){.mob-cats{display:flex!important}}`}</style>
            <div className="mob-cats" style={{display:"none",gap:8,overflowX:"auto",paddingBottom:8,marginBottom:16,scrollbarWidth:"none"}}>
              {categories.map(cat=>(
                <button key={cat.id} onClick={()=>{setActiveCatId(cat.id);setActiveSubId(null);}}
                  style={{flexShrink:0,background:activeCatId===cat.id?ACCENT:"#131317",color:activeCatId===cat.id?BG:"#777",border:`1px solid ${activeCatId===cat.id?ACCENT:BORDER}`,borderRadius:20,padding:"6px 14px",fontSize:"0.75rem",whiteSpace:"nowrap"}}>
                  {cat.icon} {cat.name}
                </button>
              ))}
            </div>

            {!activeCat ? <div style={{color:"#444",fontSize:"0.85rem"}}>Selecciona uma categoria</div> : (
              <>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:24}}>
                  <div>
                    <div style={{fontFamily:"Fraunces,serif",fontSize:"1.8rem",fontWeight:300,color:ACCENT}}>{fmt(catMonthly(activeCatId))}</div>
                    <div style={{fontSize:"0.7rem",color:MUTED,marginTop:2}}>{fmt(catMonthly(activeCatId)*12)} / ano · {subsForCat(activeCatId).length} subcategorias · <SharedBadge shared={activeCat.shared}/></div>
                  </div>
                  <Btn onClick={()=>openNewSub(activeCatId)} v="primary">+ subcategoria</Btn>
                </div>
                <div className="card-grid" style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:12}}>
                  {subsForCat(activeCatId).map(sub=>{
                    const co=companies.find(c=>c.id===sub.company_id);
                    const m=monthlyFromInvoices(invForSub(sub.id));
                    return(
                      <div key={sub.id} onClick={()=>openViewSub(sub)}
                        style={{background:SURFACE,border:`1px solid ${BORDER}`,borderRadius:10,padding:"16px 18px",cursor:"pointer",transition:"border-color .15s,transform .15s"}}
                        onMouseEnter={e=>{e.currentTarget.style.borderColor="#3a3a3e";e.currentTarget.style.transform="translateY(-1px)"}}
                        onMouseLeave={e=>{e.currentTarget.style.borderColor=BORDER;e.currentTarget.style.transform=""}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                          <div style={{fontFamily:"Fraunces,serif",fontSize:"1rem",fontWeight:300}}>{sub.name}</div>
                          <RenewalBadge date={sub.renewal_date}/>
                        </div>
                        <div style={{fontSize:"0.7rem",color:"#666",marginBottom:10,display:"flex",gap:6,alignItems:"center"}}>
                          {co?.name||"Sem empresa"} <SharedBadge shared={sub.shared}/>
                        </div>
                        <div style={{display:"flex",alignItems:"baseline",gap:6}}>
                          <span style={{fontFamily:"Fraunces,serif",fontSize:"1.2rem",fontWeight:300,color:m>0?ACCENT:"#444"}}>{m>0?fmt(m):"—"}</span>
                          {m>0&&<span style={{fontSize:"0.65rem",color:MUTED}}>/ mês (média)</span>}
                        </div>
                        <div style={{marginTop:6,fontSize:"0.65rem",color:"#444"}}>{invForSub(sub.id).length} faturas</div>
                      </div>
                    );
                  })}
                </div>
              </>
            )}
          </main>
        </div>
      )}

      {/* ── Subscriptions ── */}
      {page==="subscriptions" && (
        <div className="pg" style={{padding:"32px 40px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:24}}>
            <div>
              <span style={{fontFamily:"Fraunces,serif",fontSize:"1.8rem",fontWeight:300,color:ACCENT}}>{fmt(subscriptions.reduce((s,sub)=>s+subMonthly(sub),0))}</span>
              <span style={{fontSize:"0.7rem",color:MUTED,marginLeft:8}}>/ mês · {subscriptions.length} subscrições</span>
            </div>
            <Btn onClick={()=>{setSubscF(emptySubsc);setSubscModal({mode:"new"});}} v="primary">+ nova</Btn>
          </div>
          <div className="card-grid" style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:12}}>
            {subscriptions.map(sub=>(
              <div key={sub.id} onClick={()=>{setSubscF({name:sub.name,value:sub.value,period:sub.period,renewal_day:sub.renewal_day||"",renewal_month:sub.renewal_month||"",file_name:sub.file_name||"",file_data:sub.file_data||"",shared:sub.shared||false});setSubscModal({mode:"edit",id:sub.id});}}
                style={{background:SURFACE,border:`1px solid ${BORDER}`,borderRadius:10,padding:"16px 18px",cursor:"pointer",transition:"border-color .15s,transform .15s"}}
                onMouseEnter={e=>{e.currentTarget.style.borderColor="#3a3a3e";e.currentTarget.style.transform="translateY(-1px)"}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor=BORDER;e.currentTarget.style.transform=""}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                  <div style={{fontFamily:"Fraunces,serif",fontSize:"1rem",fontWeight:300}}>{sub.name}</div>
                  <RenewalBadge date={subRenewalDate(sub)}/>
                </div>
                <div style={{display:"flex",alignItems:"baseline",gap:6,marginBottom:4}}>
                  <span style={{fontFamily:"Fraunces,serif",fontSize:"1.2rem",fontWeight:300,color:ACCENT}}>{fmt(sub.value)}</span>
                  <span style={{fontSize:"0.65rem",color:MUTED}}>{sub.period==="Anual"?"/ ano":"/ mês"}</span>
                </div>
                <div style={{fontSize:"0.68rem",color:"#555",display:"flex",gap:6,alignItems:"center"}}>
                  {sub.period==="Anual"?sub.renewal_day&&sub.renewal_month?`renova dia ${sub.renewal_day}/${sub.renewal_month}`:"data não definida":sub.renewal_day?`renova dia ${sub.renewal_day}`:"dia não definido"}
                  <SharedBadge shared={sub.shared}/>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ── Dashboard ── */}
      {page==="dashboard" && (
        <div className="pg" style={{padding:"32px 40px"}}>
          <div className="dash-cards" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:32}}>
            {[["mensal","Total mensal",fmt(grandMonthly)],["anual","Total anual",fmt(grandMonthly*12)],["categorias","Categorias",categories.length],["subscricoes","Subscrições",subscriptions.length]].map(([id,label,val])=>(
              <div key={id} onClick={()=>setDrilldown(drilldown===id?null:id)}
                style={{background:drilldown===id?"#1e1e2a":SURFACE,border:`1px solid ${drilldown===id?"#4a4a6a":BORDER}`,borderRadius:10,padding:"16px 20px",cursor:"pointer"}}>
                <div style={{fontSize:"0.62rem",color:MUTED,letterSpacing:"0.07em",textTransform:"uppercase",marginBottom:6}}>{label}</div>
                <div style={{fontFamily:"Fraunces,serif",fontSize:"1.5rem",fontWeight:300,color:ACCENT}}>{val}</div>
                <div style={{fontSize:"0.62rem",color:drilldown===id?"#7eb8c9":"#444",marginTop:4}}>{drilldown===id?"▲ fechar":"ver detalhe →"}</div>
              </div>
            ))}
          </div>

          {drilldown&&(

                  </div>

              </div>

      {(subModal?.mode==="new"||subModal?.mode==="edit")&&(

                    </select>
                  </F>
                )}
              </div>
            )}

          <div style={{display:"flex",justifyContent:"space-between",marginTop:22}}>

              <Btn onClick={()=>setSubModal(null)}>Cancelar</Btn>
              <Btn onClick={saveSub} v="primary">Guardar</Btn>
            </div>
          </div>
        </Overlay>

            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <Btn onClick={()=>docFileRef.current.click()} v="subtle" s={{fontSize:"0.75rem"}}>{docF.file_name?`📄 ${docF.file_name.slice(0,32)}`:"+ PDF / imagem"}</Btn>
              {docF.file_data&&<a href={docF.file_data} download={docF.file_name} style={{fontSize:"0.72rem",color:ACCENT,textDecoration:"none"}}>↓ ver</a>}
              {docF.file_data&&<button onClick={()=>setDocF(f=>({...f,file_data:"",file_name:""}))} style={{background:"transparent",border:"none",color:"#553333",fontSize:"0.8rem"}}>× remover</button>}
            </div>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:24}}>
            {docModal.mode==="edit"?<Btn onClick={()=>ask("Eliminar documento?",()=>deleteDoc(docModal.id))} v="danger">Eliminar</Btn>:<div/>}
            <div style={{display:"flex",gap:8}}><Btn onClick={()=>setDocModal(null)}>Cancelar</Btn><Btn onClick={saveDoc} v="primary">Guardar</Btn></div>
          </div>
        </Overlay>
      )}

      {/* ── Subscription modal ── */}
      {subscModal&&(
        <Overlay onClose={()=>setSubscModal(null)}>
          <MTitle>{subscModal.mode==="new"?"Nova subscrição":"Editar subscrição"}</MTitle>
          <F label="Nome *"><input value={subscF.name} onChange={e=>setSubscF(f=>({...f,name:e.target.value}))} autoFocus/></F>
          <div className="fgrid" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <F label="Valor (€)" half><input type="number" step="0.01" placeholder="0.00" value={subscF.value} onChange={e=>setSubscF(f=>({...f,value:e.target.value}))}/></F>
            <F label="Periodicidade" half>
              <select value={subscF.period} onChange={e=>setSubscF(f=>({...f,period:e.target.value,renewal_day:"",renewal_month:""}))}>
                <option>Mensal</option><option>Anual</option>
              </select>
            </F>
            {subscF.period==="Mensal"&&<F label="Dia de renovação"><input type="number" min="1" max="31" placeholder="ex: 3" value={subscF.renewal_day} onChange={e=>setSubscF(f=>({...f,renewal_day:e.target.value}))}/></F>}
            {subscF.period==="Anual"&&<>
              <F label="Dia" half><input type="number" min="1" max="31" value={subscF.renewal_day} onChange={e=>setSubscF(f=>({...f,renewal_day:e.target.value}))}/></F>
              <F label="Mês" half>
                <select value={subscF.renewal_month} onChange={e=>setSubscF(f=>({...f,renewal_month:e.target.value}))}>
                  <option value="">—</option>
                  {["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"].map((m,i)=><option key={i+1} value={i+1}>{m}</option>)}
                </select>
              </F>
            </>}
            <F label="Visibilidade">
              <select value={subscF.shared?"shared":"private"} onChange={e=>setSubscF(f=>({...f,shared:e.target.value==="shared"}))}>
                <option value="private">Privada</option>
                <option value="shared">Partilhada</option>
              </select>
            </F>
          </div>
          <div style={{marginTop:14}}>
            <div style={{fontSize:"0.65rem",color:"#666",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:8}}>Documento (opcional)</div>
            <input ref={subscFileRef} type="file" accept=".pdf,.jpg,.jpeg,.png" style={{display:"none"}} onChange={e=>{
              const file=e.target.files[0];if(!file)return;
              const r=new FileReader();r.onload=ev=>setSubscF(f=>({...f,file_data:ev.target.result,file_name:file.name}));r.readAsDataURL(file);
            }}/>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <Btn onClick={()=>subscFileRef.current.click()} v="subtle" s={{fontSize:"0.75rem"}}>{subscF.file_name?`📄 ${subscF.file_name.slice(0,32)}`:"+ PDF / imagem"}</Btn>
              {subscF.file_data&&<a href={subscF.file_data} download={subscF.file_name} style={{fontSize:"0.72rem",color:ACCENT,textDecoration:"none"}}>↓ ver</a>}
              {subscF.file_data&&<button onClick={()=>setSubscF(f=>({...f,file_data:"",file_name:""}))} style={{background:"transparent",border:"none",color:"#553333",fontSize:"0.8rem"}}>× remover</button>}
            </div>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:24}}>
            {subscModal.mode==="edit"?<Btn onClick={()=>ask("Eliminar subscrição?",()=>deleteSubsc(subscModal.id))} v="danger">Eliminar</Btn>:<div/>}
            <div style={{display:"flex",gap:8}}><Btn onClick={()=>setSubscModal(null)}>Cancelar</Btn><Btn onClick={saveSubsc} v="primary">Guardar</Btn></div>
          </div>
        </Overlay>
      )}

      {/* ── Category modal ── */}
      {catModal&&(
        <Overlay onClose={()=>setCatModal(null)}>
          <MTitle>{catModal.mode==="new"?"Nova categoria":"Editar categoria"}</MTitle>
          <F label="Nome *"><input value={catF.name} onChange={e=>setCatF(f=>({...f,name:e.target.value}))}/></F>
          <F label="Ícone (emoji)"><input value={catF.icon} onChange={e=>setCatF(f=>({...f,icon:e.target.value}))} placeholder="🏠" maxLength={2}/></F>
          <F label="Visibilidade">
            <select value={catF.shared?"shared":"private"} onChange={e=>setCatF(f=>({...f,shared:e.target.value==="shared"}))}>
              <option value="private">Privada</option>
              <option value="shared">Partilhada</option>
            </select>
          </F>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:22}}>
            {catModal.mode==="edit"?<Btn onClick={()=>ask("Eliminar categoria e tudo dentro?",()=>deleteCat(catModal.id))} v="danger">Eliminar</Btn>:<div/>}
            <div style={{display:"flex",gap:8}}><Btn onClick={()=>setCatModal(null)}>Cancelar</Btn><Btn onClick={saveCat} v="primary">Guardar</Btn></div>
          </div>
        </Overlay>
      )}

      {/* ── Company modal ── */}
      {coModal&&(
        <Overlay onClose={()=>setCoModal(null)}>
          <MTitle>{coModal.mode==="new"?"Nova empresa":"Editar empresa"}</MTitle>
          <F label="Nome *"><input value={coF.name} onChange={e=>setCoF(f=>({...f,name:e.target.value}))}/></F>
          <F label="NIF"><input value={coF.nif} onChange={e=>setCoF(f=>({...f,nif:e.target.value}))}/></F>
          <F label="Contacto"><input value={coF.contact} onChange={e=>setCoF(f=>({...f,contact:e.target.value}))} placeholder="email ou telefone"/></F>
          <F label="Website"><input value={coF.website} onChange={e=>setCoF(f=>({...f,website:e.target.value}))} placeholder="https://..."/></F>
          <F label="Observações"><textarea value={coF.notes} onChange={e=>setCoF(f=>({...f,notes:e.target.value}))} rows={3} style={{resize:"vertical"}}/></F>
          <F label="Visibilidade">
            <select value={coF.shared?"shared":"private"} onChange={e=>setCoF(f=>({...f,shared:e.target.value==="shared"}))}>
              <option value="shared">Partilhada</option>
              <option value="private">Privada</option>
            </select>
          </F>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:22}}>
            {coModal.mode==="edit"?<Btn onClick={()=>ask("Eliminar empresa?",()=>deleteCo(coModal.id))} v="danger">Eliminar</Btn>:<div/>}
            <div style={{display:"flex",gap:8}}><Btn onClick={()=>setCoModal(null)}>Cancelar</Btn><Btn onClick={saveCo} v="primary">Guardar</Btn></div>
          </div>
        </Overlay>
      )}

      {/* ── Confirm dialog ── */}
      {confirmDialog&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",backdropFilter:"blur(6px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:500,padding:16}}>
          <div style={{background:SURFACE,border:`1px solid ${BORDER}`,borderRadius:12,padding:"28px 32px",maxWidth:360,width:"100%",textAlign:"center"}}>
            <div style={{fontSize:"0.9rem",color:"#c8c4bc",marginBottom:24,lineHeight:1.6}}>{confirmDialog.msg}</div>
            <div style={{display:"flex",gap:10,justifyContent:"center"}}>
              <Btn onClick={()=>setConfirmDialog(null)}>Cancelar</Btn>
              <Btn v="danger" onClick={()=>{confirmDialog.onConfirm();setConfirmDialog(null);}}>Eliminar</Btn>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW:',e));
  }
</script>
</body>
</html>
